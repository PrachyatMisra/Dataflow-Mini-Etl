# Continuous integration: lint + test on every push and pull request.
# The offline fixture run inside the test suite exercises the entire pipeline
# (extract -> transform -> validate -> load -> publish) without any network.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check etl tests

      - name: Test (pytest, offline fixture run)
        run: pytest -q

      - name: Smoke run (fixture -> SQLite -> artifacts)
        run: python -m etl run --source fixture --backend sqlite --log-level INFO

      - name: Upload artifacts snapshot
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            artifacts/
            docs/data/latest.json
          retention-days: 14
